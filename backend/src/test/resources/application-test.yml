spring:
  datasource:
    url: jdbc:h2:mem:samsara;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=20000;DB_CLOSE_DELAY=-1;NON_KEYWORDS=POSITION,DATE,TYPE,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  # The tests replace the mail sender with a mock that keeps the messages; any host turns sending on
  mail:
    host: mail.test.invalid

application:
  jwt:
    secret: test-only-secret-test-only-secret-test-only-secret-0123456789
  storage:
    type: local
    local-dir: target/test-uploads
