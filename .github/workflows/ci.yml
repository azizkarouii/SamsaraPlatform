name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (H2, then PostgreSQL with the migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samsara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests on an in-memory database
        run: mvn -B test

      - name: Tests on PostgreSQL, schema built by Flyway (constraints included)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/samsara_ci
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          SPRING_FLYWAY_ENABLED: 'true'
        run: mvn -B test

  frontend:
    name: Frontend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false --browsers=ChromeHeadless

  e2e:
    name: End-to-end (the real site in a browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: samsara_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build the backend
        working-directory: backend
        run: mvn -B -q package -DskipTests

      - name: Start the backend (email confirmation off, cookie over http)
        working-directory: backend
        env:
          PORT: '3099'
          DB_URL: jdbc:postgresql://localhost:5432/samsara_e2e
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: e2e-only-secret-e2e-only-secret-e2e-only-secret-0123456789
          EMAIL_VERIFICATION: 'false'
          COOKIE_SECURE: 'false'
          FRONTEND_URL: http://localhost:4399
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/uploads
        run: |
          nohup java -jar target/*.jar > ${{ runner.temp }}/backend.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3099/api/auth/profile || true)
            [ "$code" = "401" ] && echo "backend ready" && exit 0
            sleep 2
          done
          cat ${{ runner.temp }}/backend.log
          exit 1

      - name: Build the site
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      - name: Run the scenarios
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the report and the backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t samsara-backend backend
      - run: docker build -t samsara-frontend frontend
      - name: Nginx configuration is valid
        run: docker run --rm samsara-frontend nginx -t
