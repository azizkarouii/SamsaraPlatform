# The site and the API on the same domain: the session cookie (SameSite=Lax) needs it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 10 photos of 5 MB in one request, as allowed by the backend
    client_max_body_size 52m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's DNS, asked again after a redeploy: the backend may come back with another address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3001;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Angular names its scripts and styles after their content: they can be kept for a year
    location ~* "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Every other path is a page of the app: index.html, never cached, so a new version shows at once
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
