# The whole app: PostgreSQL, the API, the site (Nginx) and a nightly database backup.
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
# The site answers on http://localhost:${HTTP_PORT} (8080 by default); put HTTPS in front of it in production.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: samsara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samsara"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/samsara
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-true}
      # Nginx is in front: the client address comes from X-Forwarded-For (login attempts are counted per address)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPRING_MAIL_HOST: ${SMTP_HOST:-}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      MAIL_FROM: ${MAIL_FROM:-no-reply@samsara.local}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

  # Every night: a compressed dump in ./backups, the last 14 days kept.
  # Restore: gunzip -c backups/samsara-<date>.sql.gz | docker compose exec -T db psql -U postgres -d samsara
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U postgres -d samsara | gzip > /backups/samsara-$$(date +%F).sql.gz
          find /backups -name 'samsara-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  db-data:
  uploads:
